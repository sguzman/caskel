name: Bug report
description: Something in Caskel does not work as expected on Linux.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Caskel version, Linux distro and kernel
      description: Include the Caskel commit or version and whether you used the Nix package.
      placeholder: "Caskel 0.0.0 on EndeavourOS, Linux 6.x, x86_64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Commands and results using a disposable workload; do not attach production secrets.
      placeholder: |
        caskel run --rm --network none alpine:3.21 echo hello
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual result
      description: Redacted error output or logs. Do not include tokens, private mounts, or Docker credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Include Docker behavior for the same disposable workload when relevant.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Frequency, workaround, and whether the existing Docker engine was unaffected.
