name: Nix Linux build

on:
  push:
    branches:
      - main
      - feat/nix-flake
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build x86_64-linux package
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Initial flake.lock bootstrap, only on feat/nix-flake.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: cachix/install-nix-action@v31
      - name: Resolve and verify Nix inputs
        run: nix flake lock
      - name: Evaluate and build
        run: |
          nix flake check --show-trace
          nix build .#kiri --show-trace
          test -x result/bin/kiri
          test -x result/bin/kiri-init
      - name: Commit initial flake lock after successful build
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/nix-flake'
        run: |
          git add flake.lock
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore(nix): pin validated nixpkgs input'
            git push
          fi
