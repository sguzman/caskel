name: Caskel Nix Linux build

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64-linux Caskel package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify committed lockfile
        run: |
          nix flake lock
          git diff --exit-code -- flake.lock
      - name: Evaluate and build
        run: |
          nix flake check --show-trace
          nix build .#caskel --show-trace
          test -x result/bin/caskel
          test -x result/bin/kiri-init
          test -f result/lib/systemd/system/caskel.service
          grep -Fq 'ExecStart=/nix/var/nix/profiles/caskel/bin/caskel daemon' result/lib/systemd/system/caskel.service
          grep -Fq 'KIRI_SOCKET=/run/caskel/docker.sock' result/lib/systemd/system/caskel.service
          grep -Fq 'KIRI_DATA_DIR=/var/lib/caskel-daemon/data' result/lib/systemd/system/caskel.service
