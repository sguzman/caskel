name: Caskel Nix Linux build

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/nix.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64-linux Caskel package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify committed lockfile
        run: |
          nix flake lock
          git diff --exit-code -- flake.lock
      - name: Evaluate and build
        run: |
          # Historical GPL sources stay available to the repository, even
          # though the Nix derivation must not include the guest kernel tree.
          test -f guest/kernel/SOURCE_OFFER.md
          test -f guest/kernel/build.sh
          test -f scripts/ci/kernel-source.sh
          nix flake check --show-trace
          nix build .#caskel --show-trace
          test -x result/bin/caskel
          test -x result/bin/caskel-init
          test -L result/bin/kiri-init
          test -f result/lib/systemd/system/caskel.service
          grep -Fq 'ExecStart=/nix/var/nix/profiles/caskel/bin/caskel daemon' result/lib/systemd/system/caskel.service
          grep -Fq 'CASKEL_SOCKET=/run/caskel/docker.sock' result/lib/systemd/system/caskel.service
          grep -Fq 'CASKEL_DATA_DIR=/var/lib/caskel-daemon/data' result/lib/systemd/system/caskel.service
          grep -Fq 'CASKEL_AGENT=/nix/var/nix/profiles/caskel/bin/caskel-init' result/lib/systemd/system/caskel.service
          grep -Fq 'CASKEL_SOCKET_GROUP=docker' result/lib/systemd/system/caskel.service
          grep -Fq 'CASKEL_HTTP_PORT=18080' result/lib/systemd/system/caskel.service
          grep -Fq 'CASKEL_HTTPS_PORT=18443' result/lib/systemd/system/caskel.service
      # The Nix package intentionally skips privileged integration tests.
      # Compile *all* test modules; run the unprivileged suite on this hosted
      # runner. Ownership-preserving layer extraction and DNS bind tests need
      # the separate privileged Linux acceptance environment.
      - name: Verify Linux-only Cargo workspace and lockfile
        run: |
          test ! -d crates/kiri-win
          ! grep -Fq 'name = "kiri-win"' Cargo.lock
          ! grep -Fq 'name = "objc2"' Cargo.lock
          nix develop --command cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/caskel-cargo-metadata.json"
          grep -Fq '"name":"caskel"' "$RUNNER_TEMP/caskel-cargo-metadata.json"
      - name: Check Linux-only xtask wrapper
        run: nix develop --command cargo check --locked -p xtask
      - name: Check Linux-only CLI usage
        run: |
          help=$(./result/bin/caskel 2>&1 || true)
          printf '%s\n' "$help" | grep -Fq 'usage: caskel COMMAND'
          ! printf '%s\n' "$help" | grep -Eq 'caskel (setup|update|import|bench|boot)([[:space:]]|$)'
          ! printf '%s\n' "$help" | grep -Eq 'runkiri|Kiri Dev|kiri-win'
      - name: Verify cloud-free CLI rejects inherited commands
        run: |
          set -euo pipefail
          if output=$(CASKEL_ALLOW_LEGACY_KIRI_CLOUD=1 ./result/bin/caskel share status 2>&1); then
            echo 'cloud Share command unexpectedly succeeded' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Fq 'does not provide cloud sharing'
          if output=$(CASKEL_ALLOW_LEGACY_KIRI_CLOUD=1 ./result/bin/caskel diag report --send 2>&1); then
            echo 'cloud diagnostic upload unexpectedly succeeded' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Fq 'cloud uploads are disabled'
      - name: Verify legacy Kiri host control is unreachable
        run: |
          test ! -f crates/kiri/src/hostaccess.rs
          ! grep -Fq 'Some("host-access")' crates/kiri/src/main.rs
          ! grep -Fq '/usr/bin/kiri' crates/kiri/src/ui/linux.rs
          ! grep -Fq 'Command::new("pkexec")' crates/kiri/src/ui/linux.rs
          ! grep -Fq 'context", "use"' crates/kiri/src/ui/linux.rs
          ! grep -Fq 'Command::new("systemctl").arg("reboot")' crates/kiri/src/ui/linux.rs
          if ./result/bin/caskel host-access root >/dev/null 2>&1; then
            echo 'removed privileged legacy host-access command still succeeds' >&2
            exit 1
          fi
      - name: Linux agent transport unit tests
        run: nix develop --command cargo test --locked -p caskel-agent-transport
      - name: Linux Rust unit tests (unprivileged)
        run: |
          nix develop --command cargo test --locked -p caskel -p caskel-proto
          nix develop --command cargo test --locked -p caskel-init --bin caskel-init -- \
            --skip linux::dns::tests::every_forwarded_query_has_its_own_port_and_its_answer_goes_back \
            --skip linux::layers::tests::expansion_is_capped \
            --skip linux::layers::tests::layer_without_marker_is_replaced \
            --skip linux::layers::tests::retain_deletes_unused_and_broken_layers \
            --skip linux::layers::tests::symlink_parent_cannot_escape_layer \
            --skip linux::layers::tests::whiteout_through_symlink_stays_in_layer
      # Run the complete agent suite as root on a disposable CI VM.
      # This covers ownership-preserving tar extraction and privileged DNS
      # bind tests deliberately excluded from the unprivileged unit step.
      - name: Linux agent privileged unit tests (ephemeral CI VM)
        run: |
          sudo "$(command -v nix)" develop --command cargo test --locked -p caskel-init --bin caskel-init -- --test-threads=1
      # This runs only on GitHub's disposable VM. Never exercise privileged
      # container/runtime tests against a user's production Docker host.
      - name: Linux runtime smoke (ephemeral CI VM)
        run: |
          set -euo pipefail
          test -S /var/run/docker.sock
          test ! -S /run/kiri/docker.sock
          before=$(docker ps -q | sort)
          sudo "$(command -v nix)" profile install --profile /nix/var/nix/profiles/caskel "$(realpath result)"
          sudo systemctl link /nix/var/nix/profiles/caskel/lib/systemd/system/caskel.service
          sudo systemctl start caskel.service
          # Keep the temporary non-Caskel host listener from surviving test failures.
          port_owner_pid=
          udp_owner_pid=
          docker_owner_name=
          docker_owner_image_added=
          # This test runs only on a disposable GitHub CI VM. Never remove a
          # pre-existing Docker image or a user's unrelated Docker container.
          trap 'if [ -n "$port_owner_pid" ]; then kill "$port_owner_pid" 2>/dev/null || true; fi; if [ -n "$udp_owner_pid" ]; then kill "$udp_owner_pid" 2>/dev/null || true; fi; if [ -n "$docker_owner_name" ]; then docker rm -f "$docker_owner_name" >/dev/null 2>&1 || true; fi; if [ -n "$docker_owner_image_added" ]; then docker image rm "$docker_owner_image_added" >/dev/null 2>&1 || true; fi; sudo systemctl stop caskel.service || true' EXIT
          sudo systemctl is-active --quiet caskel.service
          test -S /run/caskel/docker.sock
          BIN=/nix/var/nix/profiles/caskel/bin/caskel
          # Canonical Caskel socket overrides old Kiri settings. The legacy
          # spelling still works for pinned profiles and explicit clients.
          sudo env KIRI_SOCKET=/run/caskel/nonexistent.sock CASKEL_SOCKET=/run/caskel/docker.sock "$BIN" ps >/dev/null
          sudo env KIRI_SOCKET=/run/caskel/docker.sock "$BIN" ps >/dev/null
          sudo "$BIN" run --rm --network none alpine:3.21 sh -c 'grep -Eq "^Seccomp:[[:space:]]*2" /proc/self/status'
          profile=$(mktemp)
          printf '%s\n' '{"defaultAction":"SCMP_ACT_ALLOW","syscalls":[{"names":["mkdir","mkdirat"],"action":"SCMP_ACT_ERRNO"}]}' > "$profile"
          output=$(sudo "$BIN" run --rm --network none --security-opt "seccomp=$profile" alpine:3.21 mkdir /tmp/caskel-seccomp-test 2>&1 || true)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qi 'not permitted'
          sudo "$BIN" run -d --name caskel-ci-restart --network none alpine:3.21 sleep 1d
          sudo systemctl restart caskel.service
          sudo systemctl is-active --quiet caskel.service
          sudo "$BIN" images | grep -q alpine
          sudo "$BIN" start caskel-ci-restart
          sudo "$BIN" inspect -f '{{.State.Running}}' caskel-ci-restart | grep -qx true
          sudo "$BIN" rm -f caskel-ci-restart
          # Storage tests use only Caskel and temporary resources on this
          # disposable GitHub VM. Production Docker is not used or mutated.
          # A named volume must preserve bytes after the daemon restarts,
          # and the content must be readable by a new container instance.
          sudo "$BIN" run --rm --network none -v caskel-ci-storage:/state alpine:3.21 \
            sh -c 'echo persisted > /state/marker'
          sudo systemctl restart caskel.service
          sudo systemctl is-active --quiet caskel.service
          sudo "$BIN" run --rm --network none -v caskel-ci-storage:/state alpine:3.21 \
            sh -c 'grep -qx persisted /state/marker'
          sudo "$BIN" volume rm caskel-ci-storage
          # Read-only bind mounts must allow host-file reads and reject writes
          # both from inside the container and on the original host path.
          bind_dir=$(mktemp -d)
          echo readonly-ok > "$bind_dir/marker"
          sudo "$BIN" run --rm --network none -v "$bind_dir:/proof:ro" alpine:3.21 \
            sh -c 'grep -qx readonly-ok /proof/marker && ! touch /proof/unexpected'
          test ! -e "$bind_dir/unexpected"
          rm -rf "$bind_dir"
          # Private bridge and container-name DNS regression. Only the
          # disposable CI runner's Caskel engine may create these objects.
          # The separate source Docker networks must stay unchanged.
          docker_networks_before=$(docker network ls -q | sort)
          sudo "$BIN" network create caskel-ci-dns
          sudo "$BIN" run -d --name caskel-ci-dns-peer --network caskel-ci-dns alpine:3.21 sleep 1d
          sudo "$BIN" run --rm --network caskel-ci-dns alpine:3.21 \
            sh -c 'nslookup caskel-ci-dns-peer >/dev/null'
          # Network-scoped DNS must not leak names to an unrelated private
          # bridge. A failed lookup is the expected result, not a skipped test.
          sudo "$BIN" network create caskel-ci-dns-isolated
          sudo "$BIN" run -d --name caskel-ci-isolated-peer --network caskel-ci-dns-isolated alpine:3.21 sleep 1d
          sudo "$BIN" run --rm --network caskel-ci-dns-isolated alpine:3.21 \
            sh -c 'nslookup caskel-ci-isolated-peer >/dev/null; if nslookup caskel-ci-dns-peer >/dev/null 2>&1; then echo "cross-network DNS leak" >&2; exit 1; fi'
          sudo "$BIN" rm -f caskel-ci-isolated-peer
          sudo "$BIN" network rm caskel-ci-dns-isolated
          # Removing a network while a live peer is attached must fail and
          # must not break name resolution on the still-active bridge.
          if sudo "$BIN" network rm caskel-ci-dns >/dev/null 2>&1; then
            echo 'Caskel removed a network with attached containers' >&2
            exit 1
          fi
          sudo "$BIN" run --rm --network caskel-ci-dns alpine:3.21 \
            sh -c 'nslookup caskel-ci-dns-peer >/dev/null'
          # On this disposable runner, publish a loopback-only TCP port from
          # a Caskel bridge container. This must neither affect Docker's
          # own containers nor require swapping the Docker default context.
          docker_containers_before_ports=$(docker ps -aq | sort)
          # A newly started HTTP server may not be listening on its first
          # millisecond. Retry *all* failures (including TCP reset), but only
          # accept an actual HTTP 200 page with Nginx's expected content.
          check_caskel_port() {
            local port=${1:-18765}
            for attempt in $(seq 1 12); do
              if curl -fsS --connect-timeout 1 --max-time 2 "http://127.0.0.1:$port/" 2>/dev/null \
                | grep -Fq 'Welcome to nginx!'; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          # Alpine's base BusyBox lacks the httpd applet. Use the actual
          # Nginx HTTP server image rather than a nonexistent test binary.
          sudo "$BIN" run -d --name caskel-ci-port --network caskel-ci-dns \
            -p 127.0.0.1:18765:80 nginx:1.28-alpine
          if ! check_caskel_port; then
            echo 'Caskel published TCP port unavailable: diagnostic snapshot (CI only)' >&2
            sudo "$BIN" ps -a || true
            sudo "$BIN" inspect -f '{{.State.Status}} {{.State.Error}} {{json .HostConfig.PortBindings}} {{json .NetworkSettings.Ports}}' caskel-ci-port || true
            sudo "$BIN" logs caskel-ci-port || true
            # Distinguish host-to-bridge route failures from TCP relay logic.
            # The image and names are disposable CI fixtures only.
            sudo "$BIN" run --rm --network caskel-ci-dns alpine:3.21 \
              sh -c 'wget -T 3 -qO- http://caskel-ci-port/ | grep -F "Welcome to nginx!"' || true
            bridge_ip=$(sudo "$BIN" inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' caskel-ci-port) || true
            printf 'target bridge IP: %s\n' "$bridge_ip"
            if [ -n "$bridge_ip" ]; then
              ip route get "$bridge_ip" || true
              curl -v --connect-timeout 2 --max-time 4 "http://$bridge_ip/" || true
            fi
            sudo ss -ltnp | grep -E '(:18765|State)' || true
            sudo journalctl -u caskel.service -n 90 --no-pager || true
            exit 1
          fi
          # A second Caskel container must not steal the reserved host
          # listener. The first container must remain reachable afterward.
          if sudo "$BIN" run -d --name caskel-ci-port-conflict --network caskel-ci-dns \
            -p 127.0.0.1:18765:80 alpine:3.21 sleep 1d >/dev/null 2>&1; then
            sudo "$BIN" rm -f caskel-ci-port-conflict || true
            echo 'Caskel allowed duplicate published TCP host port' >&2
            exit 1
          fi
          # A failed start may have left its metadata in Caskel; cleanup only
          # the disposable probe. Never touch the source Docker installation.
          sudo "$BIN" rm -f caskel-ci-port-conflict >/dev/null 2>&1 || true
          check_caskel_port
          # A daemon restart cannot silently claim Docker's resources.
          # Explicitly restart this test container if it was stopped.
          sudo systemctl restart caskel.service
          sudo systemctl is-active --quiet caskel.service
          if [ "$(sudo "$BIN" inspect -f '{{.State.Running}}' caskel-ci-port)" != true ]; then
            sudo "$BIN" start caskel-ci-port
          fi
          check_caskel_port
          # The custom bridge and container-name DNS registrations must work
          # after a daemon restart, not just when the bridge is first created.
          # The test explicitly restarts its own disposable peer if necessary.
          if [ "$(sudo "$BIN" inspect -f '{{.State.Running}}' caskel-ci-dns-peer)" != true ]; then
            sudo "$BIN" start caskel-ci-dns-peer
          fi
          sudo "$BIN" run --rm --network caskel-ci-dns alpine:3.21 \
            sh -c 'nslookup caskel-ci-dns-peer >/dev/null && nslookup caskel-ci-port >/dev/null'
          sudo "$BIN" rm -f caskel-ci-port
          # The deleted HTTP peer must no longer resolve, while a live DNS
          # peer on the same bridge must still resolve successfully.
          sudo "$BIN" run --rm --network caskel-ci-dns alpine:3.21 \
            sh -c 'nslookup caskel-ci-dns-peer >/dev/null; if nslookup caskel-ci-port >/dev/null 2>&1; then echo "stale HTTP peer DNS after removal" >&2; exit 1; fi'
          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18765/ >/dev/null 2>&1; then
            echo 'Caskel did not release published port after container removal' >&2
            exit 1
          fi
          # Coexistence failure/recovery: a non-Caskel process already owns
          # another loopback port. Never displace the owner's listener, even
          # when Caskel's container and bridge are otherwise valid.
          printf '%s\n' caskel-ci-owner > "$RUNNER_TEMP/caskel-ci-port-owner"
          python3 -m http.server 18766 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > /dev/null 2>&1 &
          port_owner_pid=$!
          for attempt in $(seq 1 12); do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18766/caskel-ci-port-owner 2>/dev/null \
              | grep -qx caskel-ci-owner; then
              break
            fi
            sleep 1
          done
          curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18766/caskel-ci-port-owner | grep -qx caskel-ci-owner
          if output=$(sudo "$BIN" run -d --name caskel-ci-host-port-collision --network caskel-ci-dns \
            -p 127.0.0.1:18766:80 alpine:3.21 sleep 1d 2>&1); then
            echo 'Caskel accepted a TCP host port owned by another process' >&2
            sudo "$BIN" rm -f caskel-ci-host-port-collision || true
            exit 1
          fi
          printf 'Expected external host-port collision: %s\n' "$output"
          # The failed Caskel bind cannot kill or replace the original owner.
          curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18766/caskel-ci-port-owner | grep -qx caskel-ci-owner
          sudo "$BIN" rm -f caskel-ci-host-port-collision >/dev/null 2>&1 || true
          kill "$port_owner_pid"
          wait "$port_owner_pid" || true
          port_owner_pid=
          # Once the original process exits, the exact port must be reusable
          # by Caskel, rather than stuck in a stale reservation.
          sudo "$BIN" run -d --name caskel-ci-after-port-release --network caskel-ci-dns \
            -p 127.0.0.1:18766:80 nginx:1.28-alpine
          if ! check_caskel_port 18766; then
            echo 'Caskel failed to publish host port after external owner exited' >&2
            sudo "$BIN" ps -a || true
            sudo "$BIN" logs caskel-ci-after-port-release || true
            sudo ss -ltnp | grep -E '(:18766|State)' || true
            exit 1
          fi
          sudo "$BIN" rm -f caskel-ci-after-port-release
          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18766/ >/dev/null 2>&1; then
            echo 'Caskel left the recovered host listener open after container removal' >&2
            exit 1
          fi
          # UDP coexistence regression: a host process owns the loopback
          # datagram socket. Caskel must reject the conflict, preserve the
          # original UDP service, and recover after the owner releases it.
          udp_echo_code=$(cat <<'PY'
          import socket
          import sys

          label = sys.argv[1].encode("ascii")
          port = int(sys.argv[2])
          address = sys.argv[3]
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind((address, port))
          while True:
              data, peer = sock.recvfrom(4096)
              sock.sendto(label + data, peer)
          PY
          )
          udp_probe() {
            python3 - "$1" <<'PY'
          import socket
          import sys

          expected = sys.argv[1].encode("ascii")
          with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
              sock.settimeout(1)
              sock.sendto(b"ping", ("127.0.0.1", 18767))
              reply, _ = sock.recvfrom(4096)
              assert reply == expected, (reply, expected)
          PY
          }
          check_udp_probe() {
            local expected=$1
            for attempt in $(seq 1 12); do
              if udp_probe "$expected" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          python3 -u -c "$udp_echo_code" 'owner:' 18767 127.0.0.1 >/dev/null 2>&1 &
          udp_owner_pid=$!
          if ! check_udp_probe 'owner:ping'; then
            echo 'CI UDP fixture failed to bind or reply' >&2
            exit 1
          fi
          if output=$(sudo "$BIN" run -d --name caskel-ci-udp-collision --network caskel-ci-dns \
            -p 127.0.0.1:18767:19067/udp alpine:3.21 sleep 1d 2>&1); then
            sudo "$BIN" rm -f caskel-ci-udp-collision || true
            echo 'Caskel accepted an occupied UDP host port' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Eqi 'port is already allocated|address already in use'
          udp_probe 'owner:ping'
          sudo "$BIN" rm -f caskel-ci-udp-collision >/dev/null 2>&1 || true
          kill "$udp_owner_pid"
          wait "$udp_owner_pid" || true
          udp_owner_pid=
          # This tests actual datagram forwarding and replies, not merely
          # whether a UDP socket appears in the port listing.
          sudo "$BIN" run -d --name caskel-ci-udp-echo --network caskel-ci-dns \
            -p 127.0.0.1:18767:19067/udp python:3.13-alpine \
            python3 -u -c "$udp_echo_code" 'caskel:' 19067 0.0.0.0
          if ! check_udp_probe 'caskel:ping'; then
            echo 'Caskel UDP loopback forwarding did not return the expected reply' >&2
            sudo "$BIN" ps -a || true
            sudo "$BIN" logs caskel-ci-udp-echo || true
            sudo ss -lunp | grep -E '(:18767|State)' || true
            sudo journalctl -u caskel.service -n 90 --no-pager || true
            exit 1
          fi
          sudo "$BIN" rm -f caskel-ci-udp-echo
          # Removal must free the socket for the original kind of owner.
          python3 -u -c "$udp_echo_code" 'recovered:' 18767 127.0.0.1 >/dev/null 2>&1 &
          udp_owner_pid=$!
          if ! check_udp_probe 'recovered:ping'; then
            echo 'Caskel did not release UDP host port after container removal' >&2
            exit 1
          fi
          kill "$udp_owner_pid"
          wait "$udp_owner_pid" || true
          udp_owner_pid=
          # Real Docker/Caskel coexistence, not just an ordinary host
          # listener: Docker owns a published loopback TCP port on this
          # disposable runner. Caskel must not steal that port or disrupt
          # Docker's existing container, then must recover after its release.
          docker_images_before_external=$(docker image ls -q | sort)
          if ! docker image inspect nginx:1.28-alpine >/dev/null 2>&1; then
            # Clean up only an image tag introduced by this CI fixture.
            docker_owner_image_added=nginx:1.28-alpine
          fi
          docker_owner_name=caskel-ci-docker-port-owner
          docker run -d --name "$docker_owner_name" -p 127.0.0.1:18768:80 nginx:1.28-alpine
          if ! check_caskel_port 18768; then
            echo 'Disposable Docker owner did not serve HTTP on its published port' >&2
            docker logs "$docker_owner_name" || true
            exit 1
          fi
          if output=$(sudo "$BIN" run -d --name caskel-ci-docker-port-collision --network caskel-ci-dns \
            -p 127.0.0.1:18768:80 alpine:3.21 sleep 1d 2>&1); then
            sudo "$BIN" rm -f caskel-ci-docker-port-collision || true
            echo 'Caskel accepted a TCP port occupied by the Docker engine' >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -Eqi 'port is already allocated|address already in use'
          docker inspect -f '{{.State.Running}}' "$docker_owner_name" | grep -qx true
          check_caskel_port 18768
          sudo "$BIN" rm -f caskel-ci-docker-port-collision >/dev/null 2>&1 || true
          docker rm -f "$docker_owner_name"
          docker_owner_name=
          if [ -n "$docker_owner_image_added" ]; then
            docker image rm "$docker_owner_image_added"
            docker_owner_image_added=
          fi
          test "$docker_images_before_external" = "$(docker image ls -q | sort)"
          # The same host port is now available to Caskel, which must serve
          # actual HTTP, and then release the listener after removal.
          sudo "$BIN" run -d --name caskel-ci-after-docker-release --network caskel-ci-dns \
            -p 127.0.0.1:18768:80 nginx:1.28-alpine
          if ! check_caskel_port 18768; then
            echo 'Caskel could not publish after disposable Docker owner exited' >&2
            sudo "$BIN" ps -a || true
            sudo "$BIN" logs caskel-ci-after-docker-release || true
            exit 1
          fi
          sudo "$BIN" rm -f caskel-ci-after-docker-release
          if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18768/ >/dev/null 2>&1; then
            echo 'Caskel did not release the port after the Docker coexistence probe' >&2
            exit 1
          fi
          test "$docker_containers_before_ports" = "$(docker ps -aq | sort)"
          sudo "$BIN" rm -f caskel-ci-dns-peer
          # Container removal must withdraw its DNS name, while a surviving
          # peer on the same bridge must still resolve. This positive
          # control prevents DNS outages from passing the negative test.
          sudo "$BIN" run -d --name caskel-ci-dns-survivor --network caskel-ci-dns alpine:3.21 sleep 1d
          sudo "$BIN" run --rm --network caskel-ci-dns alpine:3.21 \
            sh -c 'nslookup caskel-ci-dns-survivor >/dev/null; if nslookup caskel-ci-dns-peer >/dev/null 2>&1; then echo "stale container DNS name" >&2; exit 1; fi'
          sudo "$BIN" rm -f caskel-ci-dns-survivor
          sudo "$BIN" network rm caskel-ci-dns
          test "$docker_networks_before" = "$(docker network ls -q | sort)"
          # Discovery must query the real Docker source, even while the
          # separate Caskel daemon is running, and must not mutate it.
          docker_all_before=$(docker ps -aq | sort)
          docker_images_before=$(docker image ls -q | sort)
          sudo "$BIN" migrate docker --list > "$RUNNER_TEMP/docker-inventory.txt"
          sudo "$BIN" migrate docker --list --json > "$RUNNER_TEMP/docker-inventory.json"
          python3 - "$RUNNER_TEMP/docker-inventory.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              report = json.load(f)
          assert isinstance(report["containers"], list)
          assert isinstance(report["images"], list)
          assert isinstance(report["volumes"], list)
          assert isinstance(report["networks"], list)
          assert isinstance(report["compose_projects"], list)
          assert report["docker_version"], report
          for container in report["containers"]:
              dns = container["dns_customizations"]
              assert set(dns) == {"custom_resolvers", "search_domains", "dns_options", "extra_hosts"}
              assert all(isinstance(value, bool) for value in dns.values())
          PY
          if sudo "$BIN" migrate docker --list --socket /run/caskel/docker.sock >/dev/null 2>&1; then
            echo 'refused to reject the destination Caskel socket' >&2
            exit 1
          fi
          sudo "$BIN" migrate docker --dry-run --json > "$RUNNER_TEMP/docker-preview.json"
          python3 - "$RUNNER_TEMP/docker-preview.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)
          assert plan["mode"] == "read_only_dry_run"
          assert plan["ready_to_apply"] is False
          assert plan["target_caskel_inspected"] is False
          assert plan["workload_count"] == len(plan["workloads"])
          assert all(w["status"] == "blocked_pending_manual_validation" for w in plan["workloads"])
          assert all(isinstance(w["source_dns_customizations"], dict) for w in plan["workloads"])
          assert len(plan["proposed_manual_sequence"]) >= 7
          assert plan["potential_source_target_port_overlap"] == []
          assert plan["potential_source_target_subnet_overlap"] == []
          PY
          # Target inspection is explicitly opted in, GET-only and still
          # cannot approve a cutover. The target must be the isolated Caskel
          # socket, NOT Docker's own engine.
          sudo "$BIN" migrate docker --dry-run --target-socket /run/caskel/docker.sock --json > "$RUNNER_TEMP/target-preview.json"
          python3 - "$RUNNER_TEMP/target-preview.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)
          assert plan["target_caskel_inspected"] is True
          assert plan["ready_to_apply"] is False
          assert plan["workload_count"] == len(plan["workloads"])
          assert all(w["status"] == "blocked_pending_manual_validation" for w in plan["workloads"])
          assert isinstance(plan["potential_source_target_port_overlap"], list)
          assert isinstance(plan["potential_source_target_subnet_overlap"], list)
          assert isinstance(plan["target_network_count"], int)
          PY
          # Optional host observation: only reads /proc/net in the CLI's
          # own Linux network namespace. Combined with GET-only Caskel target
          # discovery, it must still leave every workload blocked.
          sudo "$BIN" migrate docker --dry-run --target-socket /run/caskel/docker.sock \
            --inspect-host-listeners --json > "$RUNNER_TEMP/local-listener-preview.json"
          python3 - "$RUNNER_TEMP/local-listener-preview.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              plan = json.load(f)
          assert plan["local_host_listeners_inspected"] is True
          assert plan["target_caskel_inspected"] is True
          assert isinstance(plan["observed_source_port_occupancy"], list)
          assert plan["ready_to_apply"] is False
          assert all(w["status"] == "blocked_pending_manual_validation" for w in plan["workloads"])
          PY
          if sudo "$BIN" migrate docker --list --inspect-host-listeners >/dev/null 2>&1; then
            echo 'host listener observation incorrectly accepted during --list' >&2
            exit 1
          fi
          if sudo "$BIN" migrate docker --dry-run --target-socket /var/run/docker.sock >/dev/null 2>&1; then
            echo 'Docker source accepted as a Caskel target' >&2
            exit 1
          fi
          if sudo "$BIN" migrate docker --list --target-socket /run/caskel/docker.sock >/dev/null 2>&1; then
            echo 'target option accepted outside dry-run' >&2
            exit 1
          fi
          if sudo "$BIN" migrate docker --apply >/dev/null 2>&1; then
            echo 'unsafe unsupported --apply operation accepted' >&2
            exit 1
          fi
          if sudo "$BIN" migrate docker --list --dry-run >/dev/null 2>&1; then
            echo 'mutually exclusive --list and --dry-run accepted' >&2
            exit 1
          fi
          test "$docker_all_before" = "$(docker ps -aq | sort)"
          test "$docker_images_before" = "$(docker image ls -q | sort)"
          after=$(docker ps -q | sort)
          test "$before" = "$after"
