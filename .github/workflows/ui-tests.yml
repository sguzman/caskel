# The window's page tests (scripts/ui-test.py) and its translations
# (scripts/i18n-check.py) on every pull request, so a change that breaks one
# shows on the PR before review.
#
# Safe for pull requests from forks: it runs on GitHub's machines with a
# read-only token and no secrets, and uses pull_request (never
# pull_request_target), so a fork's code can't write to the repository.
name: UI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the translations match the words in use
        run: python3 scripts/i18n-check.py
      - name: Run the page tests in headless Chrome
        run: |
          # The runner's Chrome, without the sandbox: it needs user
          # namespaces the runner doesn't allow.
          printf '#!/bin/sh\nexec google-chrome --no-sandbox "$@"\n' > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          CHROME="$RUNNER_TEMP/chrome" python3 scripts/ui-test.py

  gtk-build:
    name: Compile the branded Linux GTK window
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Install Linux GTK/WebKitGTK development libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
      - name: Compile Caskel with the optional window feature
        run: |
          nix develop --command cargo check --locked -p caskel --features window
          # The branded GTK source embeds the original Caskel SVG. It must
          # never include old Kiri binary artwork in its Linux window.
          grep -Fq 'caskel-mark.svg' crates/kiri/src/ui/gtk.rs
          test -f brand/caskel-mark.svg
          ! grep -Fq 'kiri-app-icon' crates/kiri/src/ui/gtk.rs
